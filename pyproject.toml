[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-ai-dev-state-backup"
version = "2.0.0rc1"
description = "Local Claude Code and OpenAI Codex backup, verification and staged restore for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AI Dev State Backup contributors"}]
dependencies = []
keywords = ["claude-code", "codex", "backup", "restore", "windows", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
]

[project.scripts]
aidevstate = "aidbackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/aidbackup"]
branch = true

[tool.coverage.report]
show_missing = true
