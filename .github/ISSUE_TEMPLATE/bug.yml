name: Reproducible bug report
description: Report a failure using synthetic data and redacted output.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Never upload real backups, transcripts, tokens, private keys or recovery journals.
        For a suspected vulnerability, use the repository's Security tab instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed private data and can reproduce this with synthetic files.
          required: true
        - label: I read the limitations and troubleshooting documentation.
          required: true
  - type: input
    id: version
    attributes: {label: Version and commit, placeholder: "2.0.0-rc.1"}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows edition/build, Python version, filesystem, standard/admin user; no username or hostname.
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Minimal synthetic reproduction
      description: Command, fake folder layout, expected result and actual result.
    validations: {required: true}
  - type: textarea
    id: output
    attributes:
      label: Redacted error only
      description: Paste only the relevant redacted message; not a full real backup journal.
      render: text
